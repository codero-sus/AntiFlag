[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antiflag"
version = "0.1.0"
description = "Tell a harmless Wi-Fi, school or corporate proxy apart from a real VPN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
antiflag = "antiflag.cli:main"

[tool.setuptools.packages.find]
include = ["antiflag*"]
